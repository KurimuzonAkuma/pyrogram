[build-system]
# PEP 639 metadata (`license` as an expression, `license-files` as a list) needs 1.26.3.
#  Below it the build fails with `TypeError: Field project.license-files must be a table`.
requires = ["hatchling>=1.26.3"]
build-backend = "hatchling.build"

[project]
name = "Kurigram"
dynamic = ["version"]
description = "Elegant, modern and asynchronous Telegram MTProto API framework in Python for users and bots"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Dan", email = "dan@pyrogram.org" }]
maintainers = [{ name = "KurimuzonAkuma" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Internet",
    "Topic :: Communications",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
# Every constraint is a floor, measured rather than guessed: the oldest version this code
#  works with, and the start of an unbroken range up to the newest. No ceilings, because an
#  upper bound propagates into every downstream resolve and ages by hand.
dependencies = [
    # 1.1.0 and below are Python 2 only: the import fails with a `SyntaxError` on a `print`
    #  statement, and 1.0.0 with a `NameError` on `xrange`.
    "pyaes>=1.2.0",
    # `tcp.py` builds the proxy as `Proxy(proxy_type=..., host=..., port=...)`, and 2.3.0
    #  and below have no such constructor: `TypeError: Proxy() takes no arguments`.
    "python-socks[asyncio]>=2.4.0",
]
license = "LGPL-3.0-or-later"
license-files = ["COPYING", "COPYING.lesser"]
keywords = [
    "telegram",
    "chat",
    "messenger",
    "mtproto",
    "api",
    "client",
    "library",
    "python",
]

[project.urls]
Homepage = "https://kurigram.icu"
Documentation = "https://docs.kurigram.icu"
Source = "https://github.com/KurimuzonAkuma/pyrogram"
Issues = "https://github.com/KurimuzonAkuma/pyrogram/issues"
Community = "https://t.me/kurigram_chat"

[project.optional-dependencies]
fast = [
    # 1.2.1 shipped no sdist and no wheel past `cp38`, so it cannot be installed on a
    #  current interpreter at all, while 1.2.0 below it and 1.2.2 above it both can. The
    #  floor sits above that hole rather than at the oldest working release.
    "tgcrypto>=1.2.2",
    "uvloop>=0.21.0; sys_platform == 'darwin' or sys_platform == 'linux'",
]

qrcode = [
    # `Client.authorize_qr` calls `print_ascii(tty=True)`, and on 5.2 and 5.2.1 that raises
    #  a `TypeError`: it writes bytes into a text buffer. 5.1 below the hole and 5.2.2 above
    #  it both work, so the floor sits above the hole.
    "qrcode>=5.2.2",
]

# `dev` and `docs` are tooling, not something a user of the library installs, so they are
#  dependency groups rather than extras: `uv sync` takes them from the lock file and `pip
#  install kurigram[dev]` stops being a thing anyone can type by accident.
#
# Their floors are deliberately above the oldest version that runs. A linter or a
#  documentation theme resolved a year back gives a different verdict and a different site
#  from the one CI gives, which is worse than a version conflict.
[dependency-groups]
# `dev` is the aggregate one `uv sync` installs by default. It lists groups, never packages,
#  so every package below sits in a group that says what it is for and a leaner install can
#  ask for that group alone.
dev = [
    { include-group = "lint" },
    { include-group = "release" },
    { include-group = "test" },
]

lint = [
    # The build backend, already named in `[build-system]`. It is here because
    #  `hatch_build.py` imports `hatchling.builders.hooks.plugin.interface` and `ty` checks
    #  that file like any other: without it, `make typecheck` fails on an unresolved import.
    "hatchling>=1.27.0",
    "pre-commit>=3.5.0",
    "ruff>=0.16.3",
    "ty>=0.0.78",
]

release = [
    # `twine` stores the upload token through `keyring`.
    "keyring>=25.5.0",
    "twine>=6.1.0",
]

test = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.4.0",
]

docs = [
    "Sphinx>=7.4.7",
    "shibuya>=2025.10.21",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-copybutton>=0.5.2",
    "sphinx-iconify>=0.3.0",
    "sphinx-design>=0.6.1",
    "pygments>=2.19.2",
]

# No `sphinx-iconify` release supports 3.8, so resolving `docs` against the library's own
#  `requires-python` is unsatisfiable and `uv lock` refuses the whole project. A floor on
#  the group alone keeps the library at `>=3.8`; nobody builds the documentation on 3.8.
[tool.uv.dependency-groups]
docs = { requires-python = ">=3.9" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A relay that never answers `down?cursor=&wait=` hangs a run with nothing to
#  break the deadlock. Offline tests finish in ~0.1s and the live ones stay
#  under the carrier's own 25-30s ceilings, so this only ever fires on a hang.
timeout = 120
markers = [
    "unit: fast, no network or filesystem beyond the repo",
    "guard: asserts a property of the repository rather than the behaviour of one module",
    "integration: opens a real socket or talks to a real service",
]

[tool.hatch.version]
path = "pyrogram/__init__.py"

[tool.hatch.build.hooks.custom]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
exclude = [
    ".github/",
    "docs/",
    "tests/",
    ".gitignore",
]

[tool.hatch.build.targets.wheel]
ignore-vcs = true
packages = ["pyrogram"]

[tool.ruff]
# `pyrogram/raw` and `pyrogram/errors/exceptions` are written by `make api`, so they are
# excluded here as well as in `.gitignore`: a checkout that has already been built must
# lint the same as a fresh one.
extend-exclude = ["pyrogram/raw", "pyrogram/errors/exceptions"]

[tool.ruff.lint]
# This selection is a floor, not a style guide. It is the set of rules the tree already
#  passes, so the check can only ever fail on something newly written, and it is meant to
#  grow one rule at a time. Anything wider is unusable for now: `ruff check --select ALL
#  --statistics` reports over 26000 findings, the bulk of them line length, missing
#  trailing commas and docstring section formatting.
select = [
    "E9",     # Syntax errors and files that cannot be read.
    "F632",   # `is` used against a literal.
    "F821",   # Undefined name.
    "F822",   # Undefined name in `__all__`.
    "RUF013", # Implicit `Optional`, e.g. `def method(chat_id: int = None)`.
]

[tool.ty.src]
# `pyrogram/raw/{base,functions,types,all.py}` and `pyrogram/errors/exceptions` are
#  written by `make api`; `pyrogram/raw/core` is hand-written and stays in scope. A CLI
#  `--exclude` changes tree traversal and gives a different diagnostic count, so the
#  exclude has to live here to be reproducible.
exclude = [
    "pyrogram/raw/base",
    "pyrogram/raw/functions",
    "pyrogram/raw/types",
    "pyrogram/raw/all.py",
    "pyrogram/errors/exceptions",
]

[tool.ty.rules]
# This ignore list is a ceiling, not a target: it is exactly the set of rules the tree
#  fails today, so the check can only regress on rules not listed here, and the list is
#  meant to shrink one rule at a time, the same pattern `[tool.ruff.lint].select` uses.
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-method-override = "ignore"
invalid-return-type = "ignore"
no-matching-overload = "ignore"
unresolved-attribute = "ignore"
